<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOPPY BIRD - MOBILE & ULTRA EDITION</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            touch-action: none;
        }
        
        /* ปรับ Canvas ให้ Scale อัตโนมัติเต็มจอและคงสัดส่วน 16:9 */
        #gameCanvas {
            position: absolute;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-color: #000;
        }

        #cutsceneVideo {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            border: 2px solid #3b82f6;
            z-index: 10;
            background-color: #000;
        }

        /* TOUCH CONTROLS FOR MOBILE & TABLET */
        #touchControls {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 30;
        }

        @media (pointer: coarse), (max-width: 1024px) {
            #touchControls { display: block; }
        }

        /* วงกลมอนาล็อกซ้ายล่าง */
        .analog-stick {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom));
            left: max(20px, env(safe-area-inset-left));
            width: 140px; height: 140px;
            background: rgba(15, 23, 42, 0.45);
            border: 2px solid rgba(56, 189, 248, 0.5);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .analog-thumb {
            position: absolute;
            top: 40px; left: 40px;
            width: 60px; height: 60px;
            background: rgba(56, 189, 248, 0.65);
            border: 2px solid #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            pointer-events: none;
            transition: transform 0.05s linear;
        }

        /* ปุ่ม Action ขวาล่าง */
        .action-btns {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom));
            right: max(20px, env(safe-area-inset-right));
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .action-btns button {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: rgba(225, 29, 72, 0.65);
            border: 3px solid #f43f5e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            touch-action: manipulation;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
        }

        .action-btns button:active {
            background: rgba(244, 63, 94, 0.9);
        }

        /* แผงเมนูด้านขวาบน */
        .menu-touch-btns {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            right: max(15px, env(safe-area-inset-right));
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        .menu-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1.5px solid #a855f7;
            color: #c084fc;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            touch-action: manipulation;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="1280" height="720"></canvas>
<video id="cutsceneVideo"></video>

<!-- MOBILE CONTROLS OVERLAY -->
<div id="touchControls">
    <div class="menu-touch-btns">
        <button class="menu-btn" id="btnMenuReturn">MENU</button>
        <button class="menu-btn" id="btnStage1">STG 1</button>
        <button class="menu-btn" id="btnStage2">STG 2</button>
        <button class="menu-btn" id="btnSound">SOUND</button>
    </div>

    <div class="analog-stick" id="analogStick">
        <div class="analog-thumb" id="analogThumb"></div>
    </div>

    <div class="action-btns">
        <button id="btnAction">PUSH</button>
    </div>
</div>

<script>
// =========================================================
// CONSTANTS & PATHS
// =========================================================
const SCREEN_WIDTH = 1280;
const SCREEN_HEIGHT = 720;

const BASE_PATH = "assets/";
const BOSS_PATH = BASE_PATH + "boss_pixel_art_sprites_left_transparent/";

const STAGE_MENU = 0;
const STAGE_FLAPPY = 1;
const STAGE_SHOOTER = 2;
const STAGE_CUTSCENE = 3;

// =========================================================
// ASSETS MANAGEMENT
// =========================================================
const images = {};
const sounds = {};

function loadImage(src) {
    const img = new Image();
    img.src = src;
    return img;
}

function loadSound(src, loop = false) {
    const audio = new Audio(src);
    audio.loop = loop;
    return audio;
}

images.top = loadImage(BASE_PATH + "Top.png");
images.topGold = loadImage(BASE_PATH + "TopGold.png");
images.topUI = loadImage(BASE_PATH + "TopUI.png");
images.darkBoss = loadImage(BOSS_PATH + "dark_boss.png");

const bossSpriteNames = [
    "01_boss_idle_breath_left.png",
    "02_boss_idle_crossed_arms_1_left.png",
    "03_boss_idle_crossed_arms_2_left.png",
    "04_boss_intro_look_up_left.png",
    "05_boss_intro_aura_powerup_left.png",
    "06_boss_claw_prep_left.png",
    "07_boss_claw_slash_arc_left.png",
    "08_boss_claw_slash_impact_left.png",
    "09_boss_claw_hit_effect_left.png",
    "10_boss_battle_stance_left.png",
    "11_boss_ranged_charge_left.png",
    "12_boss_ranged_gather_orb_left.png",
    "13_boss_ranged_beam_launch_left.png",
    "14_boss_ultimate_full_beam_left.png",
    "15_boss_projectile_fx_left.png"
];
images.bossSprites = bossSpriteNames.map(name => loadImage(BOSS_PATH + name));

sounds.intro = loadSound(BASE_PATH + "Intro.wav");
sounds.bgmStage1 = loadSound(BASE_PATH + "BGM.wav", true);
sounds.bgmStage2 = loadSound(BASE_PATH + "BGM2.wav", true);
sounds.grandMusic = loadSound(BASE_PATH + "GRAND.wav", true);
sounds.paradigmMusic = loadSound(BASE_PATH + "Paradigm.wav", true);
sounds.finalMusic = loadSound(BASE_PATH + "Final.wav", true);

sounds.jump = loadSound(BASE_PATH + "JUMP.wav");
sounds.coin = loadSound(BASE_PATH + "Coins.wav");
sounds.extra = loadSound(BASE_PATH + "EXTRA.wav");
sounds.hit = loadSound(BASE_PATH + "Hit.wav");

function setVolume(sound, vol) {
    if (sound) sound.volume = Math.max(0, Math.min(1, vol));
}
setVolume(sounds.bgmStage2, 0.4);
setVolume(sounds.grandMusic, 0.4);
setVolume(sounds.paradigmMusic, 0.4);
setVolume(sounds.finalMusic, 0.5);

let soundOn = true;

function playSound(sound) {
    if (!soundOn || !sound) return;
    sound.currentTime = 0;
    sound.play().catch(() => {});
}

function startMenuIntro() {
    if (currentStage !== STAGE_MENU || !soundOn || !sounds.intro) return;
    sounds.intro.currentTime = 0;
    sounds.intro.play().catch(() => {});
}

function playMusic(sound) {
    if (!soundOn || !sound) return;
    sound.play().catch(() => {});
}

function stopMusic(sound) {
    if (!sound) return;
    sound.pause();
    sound.currentTime = 0;
}

function stopAllMusic() {
    stopMusic(sounds.bgmStage1);
    stopMusic(sounds.bgmStage2);
    stopMusic(sounds.grandMusic);
    stopMusic(sounds.paradigmMusic);
    stopMusic(sounds.finalMusic);
}

// =========================================================
// AUTO RESIZE CANVAS (RESPONSIVE FOR MOBILE & IPAD)
// =========================================================
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const cutsceneVideo = document.getElementById("cutsceneVideo");

function resizeCanvas() {
    let windowWidth = window.innerWidth;
    let windowHeight = window.innerHeight;
    let windowRatio = windowWidth / windowHeight;
    let gameRatio = SCREEN_WIDTH / SCREEN_HEIGHT;

    let renderWidth, renderHeight;

    if (windowRatio > gameRatio) {
        renderHeight = windowHeight;
        renderWidth = renderHeight * gameRatio;
    } else {
        renderWidth = windowWidth;
        renderHeight = renderWidth / gameRatio;
    }

    canvas.style.width = renderWidth + "px";
    canvas.style.height = renderHeight + "px";
}

window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 200));
resizeCanvas();

// =========================================================
// GAME STATE & VARIABLES
// =========================================================
let currentStage = STAGE_MENU;
let keys = {};
let lastFrameTime = performance.now();
let globalTime = 0;

let particles = [];
let damageTexts = [];
let screenShakeTimer = 0;
let screenShakeIntensity = 0;
let stars = [];
let clouds = [];
let mountains = [];

for (let i = 0; i < 150; i++) {
    stars.push({
        x: Math.random() * SCREEN_WIDTH,
        y: Math.random() * SCREEN_HEIGHT,
        size: Math.random() * 2 + 1,
        speed: Math.random() * 80 + 20,
        color: Math.random() > 0.3 ? "#ffffff" : "#7dd3fc"
    });
}

for (let i = 0; i < 5; i++) {
    clouds.push({
        x: Math.random() * SCREEN_WIDTH,
        y: 80 + Math.random() * 120,
        width: 120 + Math.random() * 100,
        speed: 20 + Math.random() * 15
    });
}

for (let i = 0; i < 8; i++) {
    mountains.push({
        x: i * 200,
        height: 100 + Math.random() * 80,
        width: 240
    });
}

const GROUND_HEIGHT = 90;
const BIRD_X = 300;
const TARGET_CHARACTER_HEIGHT = 110; 
const PIPE_WIDTH = 95;
const PIPE_GAP = 240;
const PIPE_SPEED = 240; 
const GRAVITY = 1100;    
const JUMP_FORCE = -420; 

let birdY = SCREEN_HEIGHT / 2;
let birdVelocity = 0;
let pipes = [];
let stage1Score = 0;
let stage1GameOver = false;

let playerX = 120, playerY = SCREEN_HEIGHT / 2;
const NORMAL_PLAYER_SPEED = 380;
const ULTIMATE_PLAYER_SPEED = 500;
const MAX_PLAYER_HP = 20;
let playerHP = MAX_PLAYER_HP;
let stage2Score = 0;

let isGoldMode = false;
let goldModeStartTime = 0;
const GOLD_MODE_DURATION = 7000;
let lastGoldScoreTrigger = 0;

let isTopUIForm = false;
let lastTopUIBeamTime = 0;

let meteors = [];
let lastMeteorSpawn = 0;

let bullets = [];
let lastShotTime = 0;
const SHOT_DELAY = 180;
const BULLET_SPEED = 800;

let bossWarning = false;
let bossActive = false;
let bossDefeated = false;
let bossPhase = 1;
let bossTransforming = false;
let bossTransformStartTime = 0;
const BOSS_TRANSFORM_DURATION = 3500;
let bossivAttackTimer = 0;
let bossWarningStart = 0;
const BOSS_WARNING_TIME = 3000;
const BOSS_START_TIME = 30000;
let stage2StartTime = 0;

let bossX = 0, bossY = 0;
const BOSS_PHASE1_MAX_HP = 500;
const BOSS_PHASE2_MAX_HP = 1250;
const BOSS_PHASE3_MAX_HP = 5000;
let bossHP = BOSS_PHASE1_MAX_HP;
let currentMaxBossHP = BOSS_PHASE1_MAX_HP;
let bossWidth = 200, bossHeight = 200;

let bossSpriteIndex = 0;
let lastBossSpriteChange = 0;
const BOSS_SPRITE_DELAY = 1500;
let lastBossShot = 0;
const BOSS_SHOT_DELAY = 1200;
let bossBullets = [];

// =========================================================
// ANALOG JOYSTICK LOGIC FOR MOBILE
// =========================================================
const analogStick = document.getElementById("analogStick");
const analogThumb = document.getElementById("analogThumb");
let joystickActive = false;
let joystickTouchId = null;
let joystickCenter = { x: 0, y: 0 };
const maxRadius = 40;

analogStick.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (!joystickActive) {
        let touch = e.changedTouches[0];
        joystickTouchId = touch.identifier;
        joystickActive = true;
        let rect = analogStick.getBoundingClientRect();
        joystickCenter.x = rect.left + rect.width / 2;
        joystickCenter.y = rect.top + rect.height / 2;
        updateJoystick(touch.clientX, touch.clientY);
    }
});

window.addEventListener("touchmove", (e) => {
    if (!joystickActive) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
        let touch = e.changedTouches[i];
        if (touch.identifier === joystickTouchId) {
            e.preventDefault();
            updateJoystick(touch.clientX, touch.clientY);
        }
    }
}, { passive: false });

window.addEventListener("touchend", (e) => {
    if (!joystickActive) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
        let touch = e.changedTouches[i];
        if (touch.identifier === joystickTouchId) {
            e.preventDefault();
            resetJoystick();
        }
    }
});

function updateJoystick(clientX, clientY) {
    let dx = clientX - joystickCenter.x;
    let dy = clientY - joystickCenter.y;
    let dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
    }

    analogThumb.style.transform = `translate(${dx}px, ${dy}px)`;

    let deadzone = 8;
    keys["ArrowLeft"] = dx < -deadzone;
    keys["ArrowRight"] = dx > deadzone;
    keys["ArrowUp"] = dy < -deadzone;
    keys["ArrowDown"] = dy > deadzone;
}

function resetJoystick() {
    joystickActive = false;
    joystickTouchId = null;
    analogThumb.style.transform = `translate(0px, 0px)`;
    keys["ArrowLeft"] = false;
    keys["ArrowRight"] = false;
    keys["ArrowUp"] = false;
    keys["ArrowDown"] = false;
}

// =========================================================
// MOBILE FULLSCREEN & BUTTON BINDINGS
// =========================================================
function requestFullscreenLandscape() {
    let elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen().then(() => {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("landscape").catch(() => {});
            }
        }).catch(() => {});
    } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
    }
}

window.addEventListener("touchstart", function initMobile() {
    requestFullscreenLandscape();
    window.removeEventListener("touchstart", initMobile);
}, { once: true });

const btnAction = document.getElementById("btnAction");
btnAction.addEventListener("touchstart", (e) => {
    e.preventDefault();
    keys["Space"] = true;
    window.dispatchEvent(new KeyboardEvent("keydown", { code: "Space" }));
});
btnAction.addEventListener("touchend", (e) => {
    e.preventDefault();
    keys["Space"] = false;
    window.dispatchEvent(new KeyboardEvent("keyup", { code: "Space" }));
});

document.getElementById("btnMenuReturn").addEventListener("touchstart", (e) => {
    e.preventDefault();
    goToMenu();
});

document.getElementById("btnStage1").addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (currentStage === STAGE_MENU) startCutsceneBeforeStage1();
});

document.getElementById("btnStage2").addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (currentStage === STAGE_MENU) startStage2();
});

document.getElementById("btnSound").addEventListener("touchstart", (e) => {
    e.preventDefault();
    toggleSound();
});

function goToMenu() {
    currentStage = STAGE_MENU;
    stage1GameOver = false;
    stopAllMusic();
    startMenuIntro();
}

// =========================================================
// VFX HELPER FUNCTIONS
// =========================================================
function triggerShake(intensity, duration) {
    screenShakeIntensity = intensity;
    screenShakeTimer = duration;
}

function spawnParticles(x, y, color, count, speedMax = 200) {
    for (let i = 0; i < count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * speedMax + 20;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: Math.random() * 4 + 2,
            color: color,
            alpha: 1.0,
            life: Math.random() * 0.4 + 0.2
        });
    }
}

function spawnDamageText(x, y, text, color = "#ff3366") {
    damageTexts.push({
        x, y,
        text, color,
        alpha: 1.0,
        vy: -60,
        life: 0.6
    });
}

// =========================================================
// INPUT LISTENERS
// =========================================================
window.addEventListener("keydown", e => {
    keys[e.code] = true;

    if (currentStage === STAGE_MENU) {
        if (e.code === "Digit1") startCutsceneBeforeStage1();
        if (e.code === "Digit2") startStage2();
    } else if (currentStage === STAGE_CUTSCENE) {
        if (e.code === "Space" || e.code === "Escape" || e.code === "Enter") {
            finishCutscene();
        }
    } else if (currentStage === STAGE_FLAPPY) {
        if (stage1GameOver && (e.code === "Space" || e.code === "Enter")) {
            resetFlappy();
            playMusic(sounds.bgmStage1);
        } else if (e.code === "Space" && !stage1GameOver) {
            birdVelocity = JUMP_FORCE;
            playSound(sounds.jump);
            spawnParticles(BIRD_X - 20, birdY + 20, "#ff9900", 12, 120);
        }
    } else if (currentStage === STAGE_SHOOTER) {
        if (bossDefeated && (e.code === "Space" || e.code === "Enter")) {
            resetShooter();
            playMusic(sounds.bgmStage2);
        } else if (e.code === "Space") {
            shoot();
        }
    }

    if (e.code === "KeyM") toggleSound();
    if (e.code === "Escape" && currentStage !== STAGE_CUTSCENE) {
        if (currentStage !== STAGE_MENU) goToMenu();
    }
});

window.addEventListener("keyup", e => {
    keys[e.code] = false;
});

// =========================================================
// CUTSCENE & STAGE TRANSITIONS
// =========================================================
function startCutsceneBeforeStage1() {
    currentStage = STAGE_CUTSCENE;
    stopAllMusic();
    stopMusic(sounds.intro);

    cutsceneVideo.src = BASE_PATH + "Cuts.mp4";
    cutsceneVideo.style.display = "block";
    cutsceneVideo.currentTime = 0;

    cutsceneVideo.play().catch(() => {
        finishCutscene();
    });

    cutsceneVideo.onended = () => {
        finishCutscene();
    };
}

function finishCutscene() {
    cutsceneVideo.pause();
    cutsceneVideo.style.display = "none";
    startStage1();
}

function resetFlappy() {
    birdY = SCREEN_HEIGHT / 2;
    birdVelocity = 0;
    stage1Score = 0;
    stage1GameOver = false;
    particles = [];
    pipes = [
        createPipe(800),
        createPipe(1200),
        createPipe(1600),
        createPipe(2000)
    ];
}

function createPipe(x) {
    const gapY = 180 + Math.floor(Math.random() * (SCREEN_HEIGHT - GROUND_HEIGHT - 360));
    return { x, gapY, passed: false };
}

function resetShooter() {
    playerX = 120;
    playerY = SCREEN_HEIGHT / 2;
    playerHP = MAX_PLAYER_HP;
    stage2Score = 0;
    isGoldMode = false;
    goldModeStartTime = 0;
    lastGoldScoreTrigger = 0;
    isTopUIForm = false;
    lastTopUIBeamTime = 0;

    meteors = [];
    bullets = [];
    bossBullets = [];
    particles = [];
    damageTexts = [];

    bossWarning = false;
    bossActive = false;
    bossDefeated = false;
    bossPhase = 1;
    bossTransforming = false;
    bossivAttackTimer = 0;

    bossWidth = 200;
    bossHeight = 200;
    currentMaxBossHP = BOSS_PHASE1_MAX_HP;
    bossHP = currentMaxBossHP;

    bossSpriteIndex = 0;
    stage2StartTime = Date.now();
    lastMeteorSpawn = 0;
    lastShotTime = 0;
    lastBossShot = 0;
}

function startStage1() {
    currentStage = STAGE_FLAPPY;
    resetFlappy();
    stopAllMusic();
    playMusic(sounds.bgmStage1);
}

function startStage2() {
    currentStage = STAGE_SHOOTER;
    resetShooter();
    stopAllMusic();
    stopMusic(sounds.intro);
    playMusic(sounds.bgmStage2);
}

function toggleSound() {
    soundOn = !soundOn;
    if (!soundOn) {
        stopAllMusic();
        if (cutsceneVideo) cutsceneVideo.muted = true;
    } else {
        if (cutsceneVideo) cutsceneVideo.muted = false;
        if (currentStage === STAGE_FLAPPY && !stage1GameOver) playMusic(sounds.bgmStage1);
        else if (currentStage === STAGE_SHOOTER) {
            if (bossPhase === 3) playMusic(sounds.finalMusic);
            else if (bossPhase === 2) playMusic(sounds.paradigmMusic);
            else if (bossActive || bossWarning) playMusic(sounds.grandMusic);
            else playMusic(sounds.bgmStage2);
        } else playSound(sounds.intro);
    }
}

// =========================================================
// UPDATES LOGIC
// =========================================================
function update(delta) {
    globalTime += delta;
    updateVFX(delta);

    if (currentStage === STAGE_FLAPPY) {
        if (!stage1GameOver) updateFlappy(delta);
    } else if (currentStage === STAGE_SHOOTER) {
        if (!bossDefeated) updateShooter(delta);
    }
}

function updateVFX(delta) {
    if (screenShakeTimer > 0) {
        screenShakeTimer -= delta;
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * delta;
        p.y += p.vy * delta;
        p.alpha -= delta / p.life;
        if (p.alpha <= 0) particles.splice(i, 1);
    }

    for (let i = damageTexts.length - 1; i >= 0; i--) {
        let dt = damageTexts[i];
        dt.y += dt.vy * delta;
        dt.alpha -= delta / dt.life;
        if (dt.alpha <= 0) damageTexts.splice(i, 1);
    }

    stars.forEach(star => {
        star.x -= star.speed * delta;
        if (star.x < 0) star.x = SCREEN_WIDTH;
    });

    clouds.forEach(c => {
        c.x -= c.speed * delta;
        if (c.x + c.width < 0) c.x = SCREEN_WIDTH + 50;
    });
}

function updateFlappy(delta) {
    birdVelocity += GRAVITY * delta;
    birdY += birdVelocity * delta;

    if (Math.random() < 0.6) {
        particles.push({
            x: BIRD_X - 25,
            y: birdY + (Math.random() * 20 - 10),
            vx: -150, vy: Math.random() * 40 - 20,
            size: Math.random() * 5 + 2,
            color: "#38bdf8", alpha: 0.8, life: 0.25
        });
    }

    pipes.forEach(pipe => pipe.x -= PIPE_SPEED * delta);

    for (let i = 0; i < pipes.length; i++) {
        if (pipes[i].x + PIPE_WIDTH < 0) {
            let maxX = Math.max(...pipes.map(p => p.x));
            pipes[i] = createPipe(maxX + 400);
        }
    }

    pipes.forEach(pipe => {
        if (!pipe.passed && pipe.x + PIPE_WIDTH < BIRD_X) {
            pipe.passed = true;
            stage1Score++;
            playSound(sounds.coin);
            spawnParticles(BIRD_X, pipe.gapY, "#facc15", 25, 250);
            if (stage1Score % 10 === 0) playSound(sounds.extra);
        }
    });

    let birdRadius = (TARGET_CHARACTER_HEIGHT * 0.75) / 2;
    if (birdY - birdRadius <= 0 || birdY + birdRadius >= SCREEN_HEIGHT - GROUND_HEIGHT) {
        triggerFlappyGameOver();
        return;
    }

    for (let pipe of pipes) {
        if (checkPipeCollision(pipe)) {
            triggerFlappyGameOver();
            return;
        }
    }
}

function triggerFlappyGameOver() {
    stage1GameOver = true;
    playSound(sounds.hit);
    triggerShake(12, 0.4);
    spawnParticles(BIRD_X, birdY, "#ef4444", 40, 300);
    stopMusic(sounds.bgmStage1);
}

function checkPipeCollision(pipe) {
    let charWidth = getCharacterWidth(false, false);
    let padding = 12;
    let birdLeft = BIRD_X - charWidth / 2 + padding;
    let birdRight = BIRD_X + charWidth / 2 - padding;
    let birdTop = birdY - TARGET_CHARACTER_HEIGHT / 2 + padding;
    let birdBottom = birdY + TARGET_CHARACTER_HEIGHT / 2 - padding;

    if (birdRight < pipe.x || birdLeft > pipe.x + PIPE_WIDTH) return false;

    let topBottom = pipe.gapY - PIPE_GAP / 2;
    let bottomTop = pipe.gapY + PIPE_GAP / 2;

    return birdTop < topBottom || birdBottom > bottomTop;
}

function updateShooter(delta) {
    updatePlayer(delta);
    updateGoldModeTimer();
    updateTopUIKaijuBeam();
    spawnMeteor();
    updateMeteors(delta);
    updateBullets(delta);
    updateBossTimer();

    if (bossTransforming) {
        updateBossTransformation();
    } else if (bossActive) {
        updateBoss(delta);
        updateBossBullets(delta);
    }

    if (playerHP <= 0) {
        playerHP = 0;
        triggerShake(15, 0.5);
        spawnParticles(playerX, playerY, "#ef4444", 50, 400);
        resetShooter();
        stopMusic(sounds.grandMusic);
        stopMusic(sounds.paradigmMusic);
        stopMusic(sounds.finalMusic);
        playMusic(sounds.bgmStage2);
    }
}

function updatePlayer(delta) {
    let speed = (isTopUIForm ? ULTIMATE_PLAYER_SPEED : NORMAL_PLAYER_SPEED) * delta;
    if (keys["ArrowUp"] || keys["KeyW"]) playerY -= speed;
    if (keys["ArrowDown"] || keys["KeyS"]) playerY += speed;
    if (keys["ArrowLeft"] || keys["KeyA"]) playerX -= speed;
    if (keys["ArrowRight"] || keys["KeyD"]) playerX += speed;

    let pWidth = getCharacterWidth(isTopUIForm, isGoldMode);
    playerX = Math.max(0, Math.min(SCREEN_WIDTH - pWidth, playerX));
    playerY = Math.max(0, Math.min(SCREEN_HEIGHT - GROUND_HEIGHT - TARGET_CHARACTER_HEIGHT, playerY));

    let trailColor = isTopUIForm ? "#38bdf8" : (isGoldMode ? "#fbbf24" : "#f97316");
    particles.push({
        x: playerX,
        y: playerY + TARGET_CHARACTER_HEIGHT / 2 + (Math.random() * 20 - 10),
        vx: -200, vy: Math.random() * 60 - 30,
        size: Math.random() * 6 + 2,
        color: trailColor, alpha: 0.9, life: 0.2
    });
}

function updateGoldModeTimer() {
    if (isGoldMode && Date.now() - goldModeStartTime >= GOLD_MODE_DURATION) {
        isGoldMode = false;
    }
}

function updateTopUIKaijuBeam() {
    if (isTopUIForm && bossPhase === 3 && bossActive && !bossTransforming) {
        let now = Date.now();
        if (now - lastTopUIBeamTime >= 5000) {
            lastTopUIBeamTime = now;
            playSound(sounds.extra);
            triggerShake(10, 0.6);
            let pWidth = getCharacterWidth(true, false);
            bullets.push({
                x: playerX + pWidth,
                y: playerY + TARGET_CHARACTER_HEIGHT / 2 - 20,
                width: 300,
                height: 40,
                isTopUI: true,
                damage: 35.0,
                isTopUIBeam: true
            });
        }
    }
}

function spawnMeteor() {
    let now = Date.now();
    if (now - lastMeteorSpawn < 700) return;
    lastMeteorSpawn = now;

    let size = 45 + Math.floor(Math.random() * 45);
    let y = Math.floor(Math.random() * (SCREEN_HEIGHT - GROUND_HEIGHT - size));
    let speed = 160 + Math.random() * 220;
    
    let craters = [];
    let craterCount = 3 + Math.floor(Math.random() * 4);
    for(let i = 0; i < craterCount; i++) {
        craters.push({
            cx: Math.random() * 0.6 + 0.2,
            cy: Math.random() * 0.6 + 0.2,
            r: Math.random() * 0.18 + 0.08
        });
    }

    meteors.push({ x: SCREEN_WIDTH, y, size, speed, craters, rotation: Math.random() * Math.PI * 2 });
}

function updateMeteors(delta) {
    let pWidth = getCharacterWidth(isTopUIForm, isGoldMode);
    let padding = 10;
    for (let i = meteors.length - 1; i >= 0; i--) {
        let m = meteors[i];
        m.x -= m.speed * delta;
        m.rotation += delta * 0.5;

        if (Math.random() < 0.4) {
            particles.push({
                x: m.x + m.size,
                y: m.y + Math.random() * m.size,
                vx: Math.random() * 100 + 100, vy: (Math.random() - 0.5) * 40,
                size: Math.random() * 6 + 3,
                color: Math.random() > 0.5 ? "#f97316" : "#ef4444",
                alpha: 0.8, life: 0.3
            });
        }

        if (m.x < -m.size) {
            meteors.splice(i, 1);
            continue;
        }

        if (playerX + padding < m.x + m.size && playerX + pWidth - padding > m.x &&
            playerY + padding < m.y + m.size && playerY + TARGET_CHARACTER_HEIGHT - padding > m.y) {
            playerHP--;
            playSound(sounds.hit);
            triggerShake(8, 0.25);
            spawnParticles(m.x, m.y, "#ef4444", 20, 200);
            meteors.splice(i, 1);
        }
    }
}

function shoot() {
    let now = Date.now();
    if (now - lastShotTime < SHOT_DELAY) return;
    lastShotTime = now;

    let damage = isTopUIForm ? 15.0 : (isGoldMode ? 8.0 : 1.5);
    let pWidth = getCharacterWidth(isTopUIForm, isGoldMode);
    bullets.push({
        x: playerX + pWidth,
        y: playerY + TARGET_CHARACTER_HEIGHT / 2 - 5,
        width: (isTopUIForm || isGoldMode) ? 36 : 28,
        height: (isTopUIForm || isGoldMode) ? 16 : 12,
        isTopUI: isTopUIForm,
        isGold: !isTopUIForm && isGoldMode,
        damage: damage,
        isTopUIBeam: false
    });
}

function updateBullets(delta) {
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += BULLET_SPEED * delta;
        if (b.x > SCREEN_WIDTH) {
            bullets.splice(i, 1);
            continue;
        }

        let removed = false;
        for (let j = meteors.length - 1; j >= 0; j--) {
            let m = meteors[j];
            if (b.x < m.x + m.size && b.x + b.width > m.x &&
                b.y < m.y + m.size && b.y + b.height > m.y) {

                stage2Score++;
                spawnParticles(m.x + m.size/2, m.y + m.size/2, "#f97316", 20, 220);

                if (stage2Score > 0 && stage2Score % 20 === 0 && stage2Score !== lastGoldScoreTrigger && !isTopUIForm) {
                    lastGoldScoreTrigger = stage2Score;
                    isGoldMode = true;
                    goldModeStartTime = Date.now();
                    playSound(sounds.extra);
                }

                if (stage2Score >= 100 && !isTopUIForm) {
                    isTopUIForm = true;
                    isGoldMode = false;
                    playSound(sounds.extra);
                }

                playSound(sounds.hit);
                meteors.splice(j, 1);
                bullets.splice(i, 1);
                removed = true;
                break;
            }
        }

        if (removed) continue;

        if (bossActive && !bossTransforming) {
            if (b.x < bossX + bossWidth && b.x + b.width > bossX &&
                b.y < bossY + bossHeight && b.y + b.height > bossY) {

                bossHP -= b.damage;
                playSound(sounds.hit);
                triggerShake(3, 0.1);
                spawnParticles(b.x, b.y, "#a855f7", 8, 150);
                spawnDamageText(bossX + Math.random() * bossWidth, bossY + Math.random() * 50, "-" + Math.round(b.damage), b.isGold ? "#facc15" : "#38bdf8");

                if (!b.isTopUIBeam) bullets.splice(i, 1);

                if (bossHP <= 0) {
                    if (bossPhase === 1) startBossTransformation(2);
                    else if (bossPhase === 2) startBossTransformation(3);
                    else {
                        bossHP = 0;
                        bossDefeated = true;
                        bossActive = false;
                        triggerShake(20, 1.0);
                        spawnParticles(bossX + bossWidth/2, bossY + bossHeight/2, "#f43f5e", 100, 500);
                        stopMusic(sounds.finalMusic);
                        playMusic(sounds.bgmStage2);
                    }
                }
            }
        }
    }
}

function startBossTransformation(nextPhase) {
    bossTransforming = true;
    bossTransformStartTime = Date.now();
    bossPhase = nextPhase;
    bossBullets = [];
    playerHP = Math.min(MAX_PLAYER_HP, playerHP + Math.round(MAX_PLAYER_HP * 0.35));
    playSound(sounds.extra);
    triggerShake(20, 1.2);

    if (bossPhase === 2) {
        stopMusic(sounds.grandMusic);
        playMusic(sounds.paradigmMusic);
    } else if (bossPhase === 3) {
        stopMusic(sounds.paradigmMusic);
        playMusic(sounds.finalMusic);
    }
}

function updateBossTransformation() {
    let elapsedTime = Date.now() - bossTransformStartTime;
    let centerX = bossX + bossWidth / 2;
    let centerY = bossY + bossHeight / 2;

    for (let i = 0; i < 4; i++) {
        let angle = Math.random() * Math.PI * 2;
        let dist = 200 + Math.random() * 150;
        particles.push({
            x: centerX + Math.cos(angle) * dist,
            y: centerY + Math.sin(angle) * dist,
            vx: -Math.cos(angle) * 350,
            vy: -Math.sin(angle) * 350,
            size: Math.random() * 6 + 2,
            color: Math.random() > 0.5 ? "#c084fc" : "#ef4444",
            alpha: 1.0,
            life: 0.4
        });
    }

    if (elapsedTime >= BOSS_TRANSFORM_DURATION) {
        bossTransforming = false;
        if (bossPhase === 2) {
            currentMaxBossHP = BOSS_PHASE2_MAX_HP;
            bossWidth = 220; bossHeight = 220;
        } else if (bossPhase === 3) {
            currentMaxBossHP = BOSS_PHASE3_MAX_HP;
            bossWidth = 450; bossHeight = 450;
        }
        bossHP = currentMaxBossHP;
        bossivAttackTimer = Date.now();
        lastBossShot = Date.now();
        triggerShake(25, 0.8);
        spawnParticles(centerX, centerY, "#a855f7", 120, 600);
    }
}

function updateBossTimer() {
    if (bossActive || bossDefeated || bossTransforming) return;

    let elapsed = Date.now() - stage2StartTime;
    if (elapsed >= BOSS_START_TIME && !bossWarning) {
        bossWarning = true;
        bossWarningStart = Date.now();
        stopMusic(sounds.bgmStage2);
        playMusic(sounds.grandMusic);
    }

    if (bossWarning && Date.now() - bossWarningStart >= BOSS_WARNING_TIME) {
        bossWarning = false;
        bossActive = true;
        bossX = SCREEN_WIDTH - 280;
        bossY = 220;
        bossPhase = 1;
        bossWidth = 200; bossHeight = 200;
        currentMaxBossHP = BOSS_PHASE1_MAX_HP;
        bossHP = currentMaxBossHP;
        lastBossSpriteChange = Date.now();
    }
}

function updateBoss(delta) {
    let targetY = playerY - bossHeight / 2;
    let moveSpeed = (bossPhase === 3) ? 80 : ((bossPhase === 2) ? 140 : 90);

    if (bossY < targetY) bossY += moveSpeed * delta;
    else if (bossY > targetY) bossY -= moveSpeed * delta;

    bossY = Math.max(20, Math.min(SCREEN_HEIGHT - GROUND_HEIGHT - bossHeight, bossY));

    let now = Date.now();
    if (bossPhase === 1 && now - lastBossSpriteChange > BOSS_SPRITE_DELAY) {
        lastBossSpriteChange = now;
        bossSpriteIndex = (bossSpriteIndex + 1) % images.bossSprites.length;
    }

    if (bossPhase === 3) {
        if (now - bossivAttackTimer >= 12000) {
            bossivAttackTimer = now;
            firePhase3KaijuBurst();
        } else if (now - lastBossShot > 600) {
            lastBossShot = now;
            fireBossBullet(true);
        }
    } else if (bossPhase === 2) {
        if (now - bossivAttackTimer >= 15000) {
            bossivAttackTimer = now;
            firePhase2RandomSpreadBurst();
        } else if (now - lastBossShot > 850) {
            lastBossShot = now;
            fireBossBullet(true);
        }
    } else {
        if (now - lastBossShot > BOSS_SHOT_DELAY) {
            lastBossShot = now;
            fireBossBullet(false);
        }
    }
}

function firePhase3KaijuBurst() {
    let startX = bossX, startY = bossY + bossHeight / 2;
    triggerShake(18, 0.7);
    let angles = [-0.4, -0.2, 0.0, 0.2, 0.4];
    angles.forEach(angle => {
        let speed = 650.0;
        bossBullets.push({
            x: startX, y: startY,
            vx: -speed * Math.cos(angle), vy: speed * Math.sin(angle),
            width: 140, height: 140, isGiantBall: true
        });
    });
}

function firePhase2RandomSpreadBurst() {
    let startX = bossX, startY = bossY + bossHeight / 2;
    triggerShake(12, 0.5);
    if (Math.random() < 0.5) {
        [-0.35, -0.18, 0.0, 0.18, 0.35].forEach(angle => {
            let speed = 800.0;
            bossBullets.push({
                x: startX, y: startY - 20,
                vx: -speed * Math.cos(angle), vy: speed * Math.sin(angle),
                width: 240, height: 50, isBeam: true
            });
        });
    } else {
        let dx = playerX - startX, dy = (playerY + TARGET_CHARACTER_HEIGHT / 2) - startY;
        let baseAngle = Math.atan2(dy, dx);
        [-0.4, -0.2, 0.0, 0.2, 0.4].forEach(offset => {
            let angle = baseAngle + offset, speed = 500.0;
            bossBullets.push({
                x: startX - 30, y: startY - 30,
                vx: speed * Math.cos(angle), vy: speed * Math.sin(angle),
                width: 110, height: 110, isGiantBall: true
            });
        });
    }
}

function fireBossBullet(isDark) {
    let startX = bossX, startY = bossY + bossHeight / 2;
    let dx = playerX - startX, dy = (playerY + TARGET_CHARACTER_HEIGHT / 2) - startY;
    let len = Math.sqrt(dx * dx + dy * dy) || 1;
    let speed = (bossPhase === 3) ? 380.0 : ((bossPhase === 2) ? 320.0 : 250.0);

    bossBullets.push({
        x: startX, y: startY,
        vx: (dx / len) * speed, vy: (dy / len) * speed,
        width: 32, height: 32, isDark
    });
}

function updateBossBullets(delta) {
    let pWidth = getCharacterWidth(isTopUIForm, isGoldMode);
    let padding = 10;
    for (let i = bossBullets.length - 1; i >= 0; i--) {
        let b = bossBullets[i];
        b.x += b.vx * delta; b.y += b.vy * delta;

        if (Math.random() < 0.6) {
            let pColor = b.isGiantBall ? "#a855f7" : (b.isBeam ? "#ec4899" : "#f43f5e");
            particles.push({
                x: b.x + b.width/2,
                y: b.y + b.height/2 + (Math.random() * 10 - 5),
                vx: -b.vx * 0.2 + (Math.random() * 40 - 20),
                vy: -b.vy * 0.2 + (Math.random() * 40 - 20),
                size: Math.random() * 6 + 3,
                color: pColor, alpha: 0.8, life: 0.3
            });
        }

        if (b.x < -300 || b.x > SCREEN_WIDTH + 300 || b.y < -300 || b.y > SCREEN_HEIGHT + 300) {
            bossBullets.splice(i, 1);
            continue;
        }

        if (playerX + padding < b.x + b.width && playerX + pWidth - padding > b.x &&
            playerY + padding < b.y + b.height && playerY + TARGET_CHARACTER_HEIGHT - padding > b.y) {
            playerHP--;
            playSound(sounds.hit);
            triggerShake(6, 0.2);
            spawnParticles(b.x, b.y, "#ec4899", 15, 200);
            bossBullets.splice(i, 1);
        }
    }
}

function getCharacterWidth(isUI, isGold) {
    let img = images.top;
    if (isUI && images.topUI.complete) img = images.topUI;
    else if (isGold && images.topGold.complete) img = images.topGold;

    if (img && img.complete && img.naturalWidth > 0) {
        let aspectRatio = img.naturalWidth / img.naturalHeight;
        return TARGET_CHARACTER_HEIGHT * aspectRatio;
    }
    return TARGET_CHARACTER_HEIGHT;
}

// =========================================================
// RENDERING LOGIC
// =========================================================
function draw() {
    ctx.save();

    if (screenShakeTimer > 0) {
        let rx = (Math.random() - 0.5) * screenShakeIntensity;
        let ry = (Math.random() - 0.5) * screenShakeIntensity;
        ctx.translate(rx, ry);
    }

    ctx.clearRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

    if (currentStage === STAGE_MENU) drawMenu();
    else if (currentStage === STAGE_FLAPPY) drawFlappy();
    else if (currentStage === STAGE_SHOOTER) drawShooter();

    drawParticles();
    drawDamageTexts();

    ctx.restore();
}

function drawParticles() {
    particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
        ctx.restore();
    });
}

function drawDamageTexts() {
    damageTexts.forEach(dt => {
        ctx.save();
        ctx.globalAlpha = dt.alpha;
        ctx.font = "bold 24px monospace";
        ctx.fillStyle = dt.color;
        ctx.shadowColor = "#000";
        ctx.shadowBlur = 4;
        ctx.fillText(dt.text, dt.x, dt.y);
        ctx.restore();
    });
}

function drawMenu() {
    ctx.fillStyle = "#050515";
    ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

    stars.forEach(s => {
        ctx.fillStyle = s.color;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });

    ctx.save();
    ctx.font = "bold 85px monospace";
    ctx.shadowColor = "#3b82f6";
    ctx.shadowBlur = 25;
    ctx.fillStyle = "#38bdf8";
    let title = "TOPPY BIRD";
    ctx.fillText(title, SCREEN_WIDTH / 2 - ctx.measureText(title).width / 2, 160);
    ctx.restore();

    ctx.font = "bold 26px monospace";
    ctx.fillStyle = "#94a3b8";
    let select = "< SELECT STAGE >";
    ctx.fillText(select, SCREEN_WIDTH / 2 - ctx.measureText(select).width / 2, 230);

    drawPixelButton(390, 290, 500, 80, "[ 1 ] ORIGINAL FLAPPY BIRD");
    drawPixelButton(390, 410, 500, 80, "[ 2 ] METEOR SHOOTING BOSS");

    ctx.font = "18px monospace";
    ctx.fillStyle = "#64748b";
    let ctrl = "Tap / Click Screen to Enter Fullscreen Landscape";
    ctx.fillText(ctrl, SCREEN_WIDTH / 2 - ctx.measureText(ctrl).width / 2, 630);
}

function drawPixelButton(x, y, w, h, text) {
    ctx.save();
    ctx.fillStyle = "#090d16";
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);

    ctx.font = "bold 22px monospace";
    ctx.fillStyle = "#f8fafc";
    let tw = ctx.measureText(text).width;
    ctx.fillText(text, x + (w - tw) / 2, y + h / 2 + 8);
    ctx.restore();
}

function drawFlappy() {
    let skyGradient = ctx.createLinearGradient(0, 0, 0, SCREEN_HEIGHT - GROUND_HEIGHT);
    skyGradient.addColorStop(0, "#0284c7");
    skyGradient.addColorStop(0.6, "#38bdf8");
    skyGradient.addColorStop(1, "#bae6fd");
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

    ctx.save();
    let sunGradient = ctx.createRadialGradient(200, 150, 10, 200, 150, 90);
    sunGradient.addColorStop(0, "rgba(255, 253, 224, 1)");
    sunGradient.addColorStop(0.3, "rgba(254, 215, 170, 0.8)");
    sunGradient.addColorStop(1, "rgba(254, 215, 170, 0)");
    ctx.fillStyle = sunGradient;
    ctx.beginPath();
    ctx.arc(200, 150, 90, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    clouds.forEach(c => {
        ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        ctx.beginPath();
        let radius = 20;
        ctx.arc(c.x, c.y, radius, Math.PI * 0.5, Math.PI * 1.5);
        ctx.arc(c.x + 25, c.y - 15, radius + 8, Math.PI * 1.0, Math.PI * 1.85);
        ctx.arc(c.x + c.width - 25, c.y - 10, radius + 2, Math.PI * 1.37, Math.PI * 1.91);
        ctx.arc(c.x + c.width, c.y, radius, Math.PI * 1.5, Math.PI * 0.5);
        ctx.closePath();
        ctx.fill();
    });
    ctx.restore();

    mountains.forEach(m => {
        let mGrad = ctx.createLinearGradient(0, SCREEN_HEIGHT - GROUND_HEIGHT - m.height, 0, SCREEN_HEIGHT - GROUND_HEIGHT);
        mGrad.addColorStop(0, "#1e3a8a");
        mGrad.addColorStop(1, "#0284c7");
        ctx.fillStyle = mGrad;
        ctx.beginPath();
        ctx.moveTo(m.x, SCREEN_HEIGHT - GROUND_HEIGHT);
        ctx.lineTo(m.x + m.width / 2, SCREEN_HEIGHT - GROUND_HEIGHT - m.height);
        ctx.lineTo(m.x + m.width, SCREEN_HEIGHT - GROUND_HEIGHT);
        ctx.fill();
    });

    pipes.forEach(pipe => {
        let topHeight = pipe.gapY - PIPE_GAP / 2;
        let bottomY = pipe.gapY + PIPE_GAP / 2;
        let bottomHeight = SCREEN_HEIGHT - GROUND_HEIGHT - bottomY;

        let pipeGrad = ctx.createLinearGradient(pipe.x, 0, pipe.x + PIPE_WIDTH, 0);
        pipeGrad.addColorStop(0, "#15803d");
        pipeGrad.addColorStop(0.2, "#4ade80");
        pipeGrad.addColorStop(0.5, "#22c55e");
        pipeGrad.addColorStop(0.8, "#16a34a");
        pipeGrad.addColorStop(1, "#052e16");

        ctx.fillStyle = pipeGrad;
        ctx.fillRect(pipe.x, 0, PIPE_WIDTH, topHeight);
        ctx.strokeStyle = "#052e16";
        ctx.lineWidth = 3;
        ctx.strokeRect(pipe.x, 0, PIPE_WIDTH, topHeight);
        ctx.fillRect(pipe.x - 5, topHeight - 26, PIPE_WIDTH + 10, 26);
        ctx.strokeRect(pipe.x - 5, topHeight - 26, PIPE_WIDTH + 10, 26);

        ctx.fillRect(pipe.x, bottomY, PIPE_WIDTH, bottomHeight);
        ctx.strokeRect(pipe.x, bottomY, PIPE_WIDTH, bottomHeight);
        ctx.fillRect(pipe.x - 5, bottomY, PIPE_WIDTH + 10, 26);
        ctx.strokeRect(pipe.x - 5, bottomY, PIPE_WIDTH + 10, 26);
    });

    ctx.save();
    let grassGrad = ctx.createLinearGradient(0, SCREEN_HEIGHT - GROUND_HEIGHT, 0, SCREEN_HEIGHT - GROUND_HEIGHT + 18);
    grassGrad.addColorStop(0, "#4ade80");
    grassGrad.addColorStop(1, "#15803d");
    ctx.fillStyle = grassGrad;
    ctx.fillRect(0, SCREEN_HEIGHT - GROUND_HEIGHT, SCREEN_WIDTH, 18);

    let dirtGrad = ctx.createLinearGradient(0, SCREEN_HEIGHT - GROUND_HEIGHT + 18, 0, SCREEN_HEIGHT);
    dirtGrad.addColorStop(0, "#78350f");
    dirtGrad.addColorStop(1, "#451a03");
    ctx.fillStyle = dirtGrad;
    ctx.fillRect(0, SCREEN_HEIGHT - GROUND_HEIGHT + 18, SCREEN_WIDTH, GROUND_HEIGHT - 18);

    ctx.strokeStyle = "#166534";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, SCREEN_HEIGHT - GROUND_HEIGHT);
    ctx.lineTo(SCREEN_WIDTH, SCREEN_HEIGHT - GROUND_HEIGHT);
    ctx.stroke();
    ctx.restore();

    let charWidth = getCharacterWidth(false, false);
    ctx.save();
    ctx.translate(BIRD_X, birdY);
    let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, birdVelocity * 0.0015));
    ctx.rotate(angle);

    if (images.top.complete && images.top.naturalWidth > 0) {
        ctx.drawImage(images.top, -charWidth / 2, -TARGET_CHARACTER_HEIGHT / 2, charWidth, TARGET_CHARACTER_HEIGHT);
    } else {
        ctx.fillStyle = "#facc15";
        ctx.fillRect(-25, -25, 50, 50);
    }
    ctx.restore();

    ctx.font = "bold 40px monospace";
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#000000";
    ctx.shadowBlur = 6;
    ctx.fillText("SCORE: " + stage1Score, 30, 60);

    if (stage1GameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
        ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

        ctx.font = "bold 60px monospace";
        ctx.fillStyle = "#ef4444";
        let msg = "GAME OVER";
        ctx.fillText(msg, SCREEN_WIDTH / 2 - ctx.measureText(msg).width / 2, 320);

        ctx.font = "24px monospace";
        ctx.fillStyle = "#ffffff";
        let restart = "Tap PUSH or Space to Restart";
        ctx.fillText(restart, SCREEN_WIDTH / 2 - ctx.measureText(restart).width / 2, 390);
    }
}

function drawShooter() {
    ctx.fillStyle = "#030712";
    ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

    stars.forEach(s => {
        ctx.fillStyle = s.color;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });

    meteors.forEach(m => {
        ctx.save();
        ctx.translate(m.x + m.size / 2, m.y + m.size / 2);
        ctx.rotate(m.rotation);

        let fireGlow = ctx.createRadialGradient(0, 0, m.size * 0.3, 0, 0, m.size * 0.85);
        fireGlow.addColorStop(0, "rgba(249, 115, 22, 0.8)");
        fireGlow.addColorStop(0.5, "rgba(239, 68, 68, 0.4)");
        fireGlow.addColorStop(1, "rgba(239, 68, 68, 0)");
        ctx.fillStyle = fireGlow;
        ctx.beginPath();
        ctx.arc(0, 0, m.size * 0.85, 0, Math.PI * 2);
        ctx.fill();

        let meteorGrad = ctx.createRadialGradient(-m.size*0.15, -m.size*0.15, m.size*0.05, 0, 0, m.size*0.5);
        meteorGrad.addColorStop(0, "#a16207");
        meteorGrad.addColorStop(0.6, "#451a03");
        meteorGrad.addColorStop(1, "#1c1917");
        ctx.fillStyle = meteorGrad;
        ctx.beginPath();
        ctx.arc(0, 0, m.size / 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#0c0a09";
        m.craters.forEach(c => {
            ctx.beginPath();
            ctx.arc((c.cx - 0.5) * m.size, (c.cy - 0.5) * m.size, c.r * m.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.restore();
    });

    bullets.forEach(b => {
        ctx.save();
        let color = b.isTopUIBeam ? "#38bdf8" : (b.isGold ? "#facc15" : "#f97316");
        ctx.shadowColor = color;
        ctx.shadowBlur = b.isTopUIBeam ? 20 : 10;
        ctx.fillStyle = color;
        ctx.fillRect(b.x, b.y, b.width, b.height);
        
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(b.x + 2, b.y + b.height * 0.25, b.width - 4, b.height * 0.5);
        ctx.restore();
    });

    let pWidth = getCharacterWidth(isTopUIForm, isGoldMode);
    let pImg = isTopUIForm ? images.topUI : (isGoldMode ? images.topGold : images.top);

    if (pImg.complete && pImg.naturalWidth > 0) {
        ctx.drawImage(pImg, playerX, playerY, pWidth, TARGET_CHARACTER_HEIGHT);
    } else {
        ctx.fillStyle = isTopUIForm ? "#38bdf8" : (isGoldMode ? "#facc15" : "#3b82f6");
        ctx.fillRect(playerX, playerY, pWidth, TARGET_CHARACTER_HEIGHT);
    }

    if (bossWarning) {
        ctx.save();
        let alphaFlashing = Math.abs(Math.sin(globalTime * 8));
        ctx.fillStyle = `rgba(239, 68, 68, ${alphaFlashing * 0.3})`;
        ctx.fillRect(0, 0, SCREEN_WIDTH, 20);
        ctx.fillRect(0, SCREEN_HEIGHT - 20, SCREEN_WIDTH, 20);
        
        let bannerHeight = 140;
        let bannerY = SCREEN_HEIGHT / 2 - bannerHeight / 2;
        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.fillRect(0, bannerY, SCREEN_WIDTH, bannerHeight);
        
        ctx.strokeStyle = `rgba(239, 68, 68, ${0.5 + alphaFlashing * 0.5})`;
        ctx.lineWidth = 4;
        ctx.strokeRect(0, bannerY, SCREEN_WIDTH, bannerHeight);

        ctx.font = "900 65px monospace";
        ctx.shadowColor = "#ef4444";
        ctx.shadowBlur = 30 * alphaFlashing;
        ctx.fillStyle = "#ffffff";
        let warnText = "WARNING : BOSS APPROACHING";
        let textWidth = ctx.measureText(warnText).width;
        let textX = SCREEN_WIDTH / 2 - textWidth / 2;

        if (Math.random() < 0.2) {
            ctx.fillStyle = "#38bdf8";
            ctx.fillText(warnText, textX + (Math.random() * 8 - 4), 365 + (Math.random() * 4 - 2));
        }
        ctx.fillStyle = "#f43f5e";
        ctx.fillText(warnText, textX, 365);

        ctx.font = "bold 22px monospace";
        ctx.fillStyle = "#fda4af";
        let subText = "DANGER LEVEL: MAXIMUM - PREPARE FOR BATTLE";
        ctx.fillText(subText, SCREEN_WIDTH / 2 - ctx.measureText(subText).width / 2, 410);
        ctx.restore();
    }

    if (bossActive || bossTransforming) {
        let centerX = bossX + bossWidth / 2;
        let centerY = bossY + bossHeight / 2;

        if (bossTransforming) {
            ctx.save();
            let darkOverlay = ctx.createRadialGradient(centerX, centerY, 100, SCREEN_WIDTH / 2, SCREEN_HEIGHT / 2, 800);
            darkOverlay.addColorStop(0, "rgba(0,0,0,0.2)");
            darkOverlay.addColorStop(1, "rgba(0,0,0,0.8)");
            ctx.fillStyle = darkOverlay;
            ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

            let pulseSize = 1.3 + Math.sin(globalTime * 20) * 0.2;
            let auraGrad = ctx.createRadialGradient(centerX, centerY, 20, centerX, centerY, (bossWidth / 2) * pulseSize);
            auraGrad.addColorStop(0, "#ffffff");
            auraGrad.addColorStop(0.3, "#c084fc");
            auraGrad.addColorStop(0.7, "#7e22ce");
            auraGrad.addColorStop(1, "rgba(126, 34, 206, 0)");
            ctx.fillStyle = auraGrad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, (bossWidth / 2) * pulseSize, 0, Math.PI * 2);
            ctx.fill();

            if (Math.random() < 0.4) {
                ctx.strokeStyle = "#e879f9";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + (Math.random() - 0.5) * 300, centerY + (Math.random() - 0.5) * 300);
                ctx.stroke();
            }

            if (images.darkBoss.complete && images.darkBoss.naturalWidth > 0) {
                ctx.shadowColor = "#a855f7";
                ctx.shadowBlur = 40;
                ctx.drawImage(images.darkBoss, bossX, bossY, bossWidth, bossHeight);
            }

            ctx.font = "900 42px monospace";
            ctx.fillStyle = "#f43f5e";
            ctx.shadowColor = "#000";
            ctx.shadowBlur = 10;
            let transText = `AWAKENING PHASE ${bossPhase}...`;
            ctx.fillText(transText, SCREEN_WIDTH / 2 - ctx.measureText(transText).width / 2, 120);

            ctx.restore();
        } else {
            let bImg = (bossPhase >= 2) ? images.darkBoss : (images.bossSprites[bossSpriteIndex] || images.darkBoss);

            if (bImg && bImg.complete && bImg.naturalWidth > 0) {
                ctx.save();
                if (bossPhase >= 2) {
                    ctx.shadowColor = bossPhase === 3 ? "#ef4444" : "#a855f7";
                    ctx.shadowBlur = 20;
                }
                ctx.drawImage(bImg, bossX, bossY, bossWidth, bossHeight);
                ctx.restore();
            } else {
                ctx.fillStyle = "#881337";
                ctx.fillRect(bossX, bossY, bossWidth, bossHeight);
            }
        }

        ctx.save();
        let barX = SCREEN_WIDTH / 2 - 250;
        let barY = 25;
        let barW = 500;
        let barH = 22;

        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.fillRect(barX - 4, barY - 4, barW + 8, barH + 8);
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 2;
        ctx.strokeRect(barX - 4, barY - 4, barW + 8, barH + 8);

        let hpRatio = Math.max(0, bossHP / currentMaxBossHP);
        let hpGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
        hpGrad.addColorStop(0, "#ef4444");
        hpGrad.addColorStop(0.5, "#f43f5e");
        hpGrad.addColorStop(1, "#881337");
        ctx.fillStyle = hpGrad;
        ctx.fillRect(barX, barY, barW * hpRatio, barH);

        ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
        ctx.fillRect(barX, barY, barW * hpRatio, barH * 0.35);
        ctx.restore();
    }

    bossBullets.forEach(b => {
        ctx.save();
        if (b.isGiantBall) {
            let centerX = b.x + b.width / 2;
            let centerY = b.y + b.height / 2;
            let radius = b.width / 2;

            let auraGrad = ctx.createRadialGradient(centerX, centerY, radius * 0.2, centerX, centerY, radius * 1.4);
            auraGrad.addColorStop(0, "rgba(236, 72, 153, 1)");
            auraGrad.addColorStop(0.5, "rgba(168, 85, 247, 0.8)");
            auraGrad.addColorStop(1, "rgba(168, 85, 247, 0)");
            ctx.fillStyle = auraGrad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 1.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(globalTime * 6);
            ctx.strokeStyle = "#f43f5e";
            ctx.lineWidth = 5;
            ctx.setLineDash([15, 10]);
            ctx.beginPath();
            ctx.arc(0, 0, radius * 1.1, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            let coreGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius * 0.8);
            coreGrad.addColorStop(0, "#ffffff");
            coreGrad.addColorStop(0.4, "#f43f5e");
            coreGrad.addColorStop(1, "#881337");
            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 0.8, 0, Math.PI * 2);
            ctx.fill();

        } else if (b.isBeam) {
            ctx.shadowColor = "#ec4899";
            ctx.shadowBlur = 25;
            
            let beamGrad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.height);
            beamGrad.addColorStop(0, "#a855f7");
            beamGrad.addColorStop(0.5, "#ec4899");
            beamGrad.addColorStop(1, "#a855f7");
            ctx.fillStyle = beamGrad;
            ctx.fillRect(b.x, b.y, b.width, b.height);

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(b.x, b.y + b.height * 0.3, b.width, b.height * 0.4);

        } else {
            let centerX = b.x + b.width / 2;
            let centerY = b.y + b.height / 2;

            ctx.shadowColor = "#f43f5e";
            ctx.shadowBlur = 15;

            ctx.fillStyle = "#ec4899";
            ctx.beginPath();
            ctx.arc(centerX, centerY, b.width * 0.7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(centerX, centerY, b.width * 0.35, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    });

    ctx.font = "bold 24px monospace";
    ctx.fillStyle = "#ffffff";
    ctx.fillText("HP: " + playerHP + " / " + MAX_PLAYER_HP, 30, 40);
    ctx.fillText("SCORE: " + stage2Score, 30, 70);

    if (bossDefeated) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

        ctx.font = "bold 60px monospace";
        ctx.fillStyle = "#22c55e";
        let vic = "VICTORY!";
        ctx.fillText(vic, SCREEN_WIDTH / 2 - ctx.measureText(vic).width / 2, 320);

        ctx.font = "24px monospace";
        ctx.fillStyle = "#ffffff";
        let restart = "Tap PUSH or Space to Replay Stage 2";
        ctx.fillText(restart, SCREEN_WIDTH / 2 - ctx.measureText(restart).width / 2, 390);
    }
}

// =========================================================
// MAIN GAME LOOP
// =========================================================
function gameLoop(now) {
    let delta = (now - lastFrameTime) / 1000;
    lastFrameTime = now;

    if (delta > 0.1) delta = 0.1;

    update(delta);
    draw();

    requestAnimationFrame(gameLoop);
}

startMenuIntro();
requestAnimationFrame(gameLoop);

</script>
